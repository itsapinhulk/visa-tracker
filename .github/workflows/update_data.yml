name: Update Data

on:
  schedule: # Run every day at fixed times
    - cron: "31 7,11,13,17,21 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # --fallback clears the Cloudflare challenge on the HTML pages with a real
      # Chromium, which needs the browser + its system libraries (install-deps
      # also pulls in xvfb for the headless runner).
      - name: Install browser for Cloudflare fallback
        run: uv run --frozen patchright install-deps chromium

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"


      # travel.state.gov puts the HTML pages behind a Cloudflare challenge that
      # this runner does not clear on its own, but serves the PDF of the same
      # bulletin without one -- so --any-source tries the HTML, browser and all,
      # and falls through to the PDF when that gets nowhere.
      - name: Script
        run: |
          mkdir -p ./cache
          ./update_data.sh --ignore_404 --aggressive --any-source --fallback --ignore-fallback-failure
          git status

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.0
        with:
          commit-message: Update CSV data
          title: Update CSV
          branch: auto/update-data
          delete-branch: true
          reviewers: itsapinhulk
