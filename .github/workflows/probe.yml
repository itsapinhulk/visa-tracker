name: Probe Downloads

# Run by hand when a data update comes back empty: prints how travel.state.gov
# answers the runner, so a refusal can be told apart from a broken parser.
on:
  workflow_dispatch:
    inputs:
      year:
        description: Year of the bulletin to ask for
        required: true
        default: "2026"
      month:
        description: Month of the bulletin to ask for
        required: true
        default: "9"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Probe
        run: |
          uv run --frozen python -m src.downloader.probe \
            --year "${{ inputs.year }}" --month "${{ inputs.month }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
